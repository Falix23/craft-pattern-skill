name: validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check.py
      - run: python scripts/build.py examples/input.json --output outputs/demo.html --no-archive
      - run: python scripts/generate.py examples/demo.png --longest-edge 48 --background auto --output outputs/direct --no-archive
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: outputs/
